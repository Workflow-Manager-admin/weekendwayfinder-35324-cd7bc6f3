<div class="planner-wrapper">
  <div class="planner-card">
    <h2>Plan Your Weekend Adventure</h2>
    <form class="planner-form">
      <label>
        Distance (km):
        <input type="number" placeholder="e.g. 200" name="distance" min="0"/>
      </label>
      <label>
        Mood:
        <select name="mood">
          <option>Relaxing</option>
          <option>Adventurous</option>
          <option>Cultural</option>
        </select>
      </label>
      <label>
        Budget ($):
        <input type="number" placeholder="e.g. 150" name="budget" min="0"/>
      </label>
      <button type="submit">Find Trips</button>
    </form>
  </div>
</div>
